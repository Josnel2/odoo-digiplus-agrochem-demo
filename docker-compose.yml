services:
  db:
    image: postgres:15
    container_name: digiplus_agrochem_demo_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: ${ODOO_IMAGE}
    container_name: digiplus_agrochem_demo_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${ODOO_PORT}:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./addons:/mnt/extra-addons
      - ./import_data:/mnt/import_data
      - ./bi:/mnt/bi
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]

  ollama:
    image: ollama/ollama:latest
    container_name: digiplus_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-1024}
    volumes:
      - ollama_data:/root/.ollama

  ai-service:
    build:
      context: ./ai_service
    container_name: digiplus_ai_service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-11434}:8000"
    environment:
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1024}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  odoo_data:
  postgres_data:
  ollama_data:
